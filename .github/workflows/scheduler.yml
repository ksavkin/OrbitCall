name: Factory schedule worker
on:
  pull_request:
    paths: ['services/scheduler/**', 'convex/lib/scheduleClient.ts', 'tests/scheduleClient.test.ts', '.github/workflows/scheduler.yml']
  push:
    branches: [main]
    paths: ['services/scheduler/**', 'convex/lib/scheduleClient.ts', 'tests/scheduleClient.test.ts', '.github/workflows/scheduler.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/scheduler/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm ci --ignore-scripts
        working-directory: services/scheduler
      - run: npm run check
        working-directory: services/scheduler
      - run: docker build -t orbitcall-scheduler:test services/scheduler
      # No credentials or provider calls: live Factory evidence is a separate authorized deployment check.
