name: Orbit service checks

# The tests read the repo's pinned snapshots and TLE groups through setup-data.sh.
on:
  pull_request:
    paths:
      - "services/orbit/**"
      - "data/snapshots/**"
      - "web/data/snapshot/**"
      - ".github/workflows/orbit.yml"
  push:
    branches: [main]
    paths:
      - "services/orbit/**"
      - "data/snapshots/**"
      - "web/data/snapshot/**"
      - ".github/workflows/orbit.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/orbit
    steps:
      - uses: actions/checkout@v4
      - name: Check that services/orbit exists
        id: present
        working-directory: .
        run: |
          if [ -d services/orbit ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::services/orbit is not on this branch yet, so its checks are skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/orbit/src/requirements.txt
      - name: Install dependencies
        if: steps.present.outputs.present == 'true'
        run: pip install -r src/requirements.txt
      - name: Build the data folder
        if: steps.present.outputs.present == 'true'
        run: ./setup-data.sh "$GITHUB_WORKSPACE"
      - name: Run tests
        if: steps.present.outputs.present == 'true'
        working-directory: services/orbit/src
        run: python -m pytest -q tests
