name: Backend checks

on:
  pull_request:
    paths:
      - "convex/**"
      - "fixtures/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "fixtures/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Task branches do not commit convex/_generated/ (issue #6). --system-udfs generates
      # from the local convex/ folder with no deployment or secret; the output is not committed.
      - name: Regenerate Convex API types
        run: npx convex codegen --system-udfs --typecheck disable
      - run: npm run check
